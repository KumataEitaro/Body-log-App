# Android 起動スモークテスト（2026-09-04）
#
# 【なぜあるか】
# iOS は正常なのに Android は「一瞬で落ちる」が、内部テストではリリース前レポートが出ず、
# 手元に adb も無く、スタックトレースが一切取れなかった。
# このワークフローは **リリース構成（Hermes・release variant）の APK をエミュレータで起動し、
# 10秒後にプロセスが生きているかを見て、logcat をアーティファクトとして残す**。
# 落ちればトレースがここで読める。落ちなければ「Android で起動する」ことの機械的な保証になる。
#
# 【いつ走るか】
# ・手動（Actions → Android smoke → Run workflow）
# ・main への push で native/ か codemagic 関連が変わったとき
# GitHub Actions の私有リポジトリ無料枠は 2,000分/月。1回 ≒ 20〜25分なので、
# main への push が1日5回を超えるようなら paths を絞るか手動のみに落とす。
#
# 【Codemagic と何が違うか】
# Codemagic の rn-android は「Play に上げる .aab を作る」ためのもの（署名・アップロード）。
# こちらは「起動するか」だけを見る。署名はデバッグ鍵で構わないので鍵を渡さない＝
# シークレットを GitHub に置かない。
name: Android smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/android-smoke.yml'

# 同じブランチで新しい push があったら、走っている古い実行は打ち切る。
# main の最新が起動するかだけが知りたいので、追い越された実行に無料枠を使わない。
#
# ⚠️ そのとき古い実行は「失敗」として赤く出て、注釈は
#    "Canceling since a higher priority waiting request ... exists" になる。
#    **これはアプリのクラッシュではない**（2026-09-04 に実際に紛らわしかった）。
#    赤い実行を見たら、まず注釈がキャンセルかどうかを確認すること。
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ci-logs ブランチへクラッシュ抜粋を push するため（Public リポジトリなので raw URL でログイン無しに読める）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM（エミュレータを高速に回す）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # packages を明示するのは 2026-09-15 の外部起因の故障への対処（run #18 がここで7秒で落ちた）。
      # このアクションの既定は 'tools platform-tools' だが、Google が **deprecated な `tools` パッケージの
      # 配信を停止した**ため sdkmanager が exit 1 になる（android-actions/setup-android#537・同日起票）。
      # 本家の回避策どおり `platform-tools` だけを要求する。ビルドに必要な platform / build-tools は
      # Gradle が自前で入れるので、これで足りる。上流が既定を直したらこの行は消してよい。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: native
        run: npm ci

      - name: Prebuild（android/ を生成）
        working-directory: native
        run: npx expo prebuild --platform android --no-install --clean

      - name: Autolink 一覧を残す（iOS 専用ネイティブが混ざっていないかを後から読める）
        working-directory: native
        run: |
          npx expo-modules-autolinking react-native-config --platform android --json > autolink-rn.json
          npx expo-modules-autolinking resolve --platform android --json > autolink-expo.json
          echo "== RN CLI 系 =="; node -e "const c=require('./autolink-rn.json');console.log(Object.keys(c.dependencies).filter(n=>c.dependencies[n].platforms&&c.dependencies[n].platforms.android).join('\n'))"
          echo "== Expo 系 =="; node -e "const c=require('./autolink-expo.json');console.log((c.modules||[]).map(m=>m.packageName).join('\n'))"
          # iOS 専用ネイティブが Android に漏れていたらここで落とす（テストと二重で見張る）
          if node -e "const c=require('./autolink-rn.json');const d=c.dependencies;process.exit((d['react-native-nitro-modules']&&d['react-native-nitro-modules'].platforms.android)||(d['@kingstinct/react-native-healthkit']&&d['@kingstinct/react-native-healthkit'].platforms.android)?1:0)"; then
            echo "✅ nitro / healthkit は Android に含まれていない"
          else
            echo "❌ iOS 専用ネイティブが Android の autolink に含まれている" >&2; exit 1
          fi

      - name: Build release APK（x86_64 のみ・エミュレータ用）
        working-directory: native/android
        # 本番と同じ release variant（Hermes バイトコード・minify 設定も同じ）。ABI はエミュレータぶんだけに絞って時間を削る
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Run on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner は script: を **1行ずつ別々の sh -c で実行**する。関数定義や if が
          # 途中で切れて「Syntax error: end of file unexpected」になった（2026-09-05 #3〜#5）。
          # 本体は scripts/ci/android-smoke.sh に置き、ここは1行で呼ぶだけにする。
          script: bash scripts/ci/android-smoke.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-logs
          path: |
            logcat-full.txt
            logcat-app.txt
            logcat-crash.txt
            ui-dump.xml
            screen-*.png
            native/autolink-rn.json
            native/autolink-expo.json
          retention-days: 14

      - name: クラッシュ抜粋を ci-logs ブランチへ公開（ログイン無しで読めるように）
        if: always()
        # 公開に失敗しても Verdict（本来の判定）は走らせる
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f smoke-summary.md ] || { echo "抜粋が無い（エミュレータ前で失敗）"; exit 0; }
          # #12 の失敗: 作業ツリー内で --orphan → git rm → add -A としたら node_modules/ や android/build まで
          # 追加されて 2 分後に落ちた。**別ディレクトリの空リポジトリ**で ci-logs だけを扱う。
          PUB=/tmp/cilogs-repo
          rm -rf "$PUB" && mkdir -p "$PUB" && cd "$PUB"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin ci-logs 2>/dev/null; then
            git checkout -q -b ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
          fi
          DEST="android-smoke/${GITHUB_RUN_NUMBER}"
          mkdir -p "$DEST"
          cp "${GITHUB_WORKSPACE}/smoke-summary.md" "$DEST/summary.md"
          cp "${GITHUB_WORKSPACE}/logcat-crash.txt" "$DEST/" 2>/dev/null || true
          cp "${GITHUB_WORKSPACE}/logcat-app.txt" "$DEST/" 2>/dev/null || true
          rm -rf android-smoke/latest && cp -r "$DEST" android-smoke/latest
          printf '# Android smoke logs\n\n最新: android-smoke/latest/summary.md（run #%s・%s）\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA}" > README.md
          git add -A
          git commit -qm "android-smoke #${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})"
          git push -q origin ci-logs
          echo "公開: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-logs/android-smoke/latest/summary.md"

      - name: Verdict
        run: |
          if [ "${ALIVE}" != "1" ]; then
            echo "❌ アプリが生きていません。Artifacts の logcat-crash.txt / logcat-full.txt を読む" >&2
            exit 1
          fi
          # どの操作で落ちたかはスクリプトが STEPS_FAILED に積む（起動／ダーク切替／回転／前景復帰／描画）
          if [ -n "${STEPS_FAILED}" ]; then
            echo "❌ 通らなかった操作: ${STEPS_FAILED}" >&2
            exit 1
          fi
          # 生きていても致命例外が出ていたら落とす（ErrorBoundary が拾って画面だけ出ている可能性）
          if grep -q "FATAL EXCEPTION\|Fatal signal" logcat-full.txt; then
            echo "❌ プロセスは生きているが致命例外のログがある" >&2
            exit 1
          fi
          echo "✅ 起動・画面の描画・ダークモード切替・画面の回転・前景復帰をすべて通過"
