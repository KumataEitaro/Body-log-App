# BodyLog iOS — Codemagic クラウドビルド設定（Mac不要でTestFlightまで届ける）
# 事前準備（Codemagic側のUIで1回だけ）:
#  1. Teams > Integrations > App Store Connect でAPIキーを登録（名前: bodylog-asc）
#  2. このリポジトリをCodemagicに接続し、このworkflowを実行
workflows:
  ios-testflight:
    name: BodyLog iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # mainへのpushで自動ビルド（[skip ci]付きコミットはスキップされる）
    # 旧Capacitor版の自動ビルドは停止（2026-08-26）。本命は ios-release（RN版）。
    # 手動でStart new buildすれば今もビルド可能。
    environment:
      xcode: latest
      node: 22
      vars:
        BUNDLE_ID: com.gotcha.bodylog
        # ウィジェットのビルドスイッチ。Apple Developer portalでApp Group
        # (group.com.gotcha.bodylog) を両Bundle IDに設定済み（2026-08-05完了）
        ENABLE_WIDGET: "true"
      ios_signing:
        # bundle_identifierは拡張（com.gotcha.bodylog.*）のプロファイルにも自動マッチする
        distribution_type: app_store
        bundle_identifier: com.gotcha.bodylog
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Add widget extension target (ENABLE_WIDGET=true のみ)
        script: |
          if [ "$ENABLE_WIDGET" != "true" ]; then
            echo "ENABLE_WIDGET != true → ウィジェットなしでビルド"
            exit 0
          fi
          # 本体アプリのentitlementsにApp Groupを注入（ビルド時のみ・リポジトリは汚さない）
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" ios/App/App/App.entitlements || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string group.com.gotcha.bodylog" ios/App/App/App.entitlements || true
          gem list -i xcodeproj > /dev/null 2>&1 || gem install xcodeproj --no-document
          ruby scripts/add-widget-target.rb
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          xcode-project use-profiles
          set +e
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          RC=$?
          if [ $RC -ne 0 ]; then
            # 失敗時: 生のxcodebuildログからエラー行を抜き出してこのステップのログに直接出す
            echo "=================== xcodebuild エラー抜粋 ==================="
            LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LOG" ]; then
              grep -nE "(: error:|error generated|❌|fatal error:)" "$LOG" | head -60
              echo "-------------------- ログ末尾200行 --------------------"
              tail -200 "$LOG"
            else
              echo "xcodebuildログが見つかりません"
            fi
            echo "============================================================"
          fi
          exit $RC
      - name: Verify entitlements (診断)
        script: |
          set +e
          echo "===== pbxproj CODE_SIGN_ENTITLEMENTS ====="
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj || echo "(なし)"
          echo "===== App.entitlements ====="
          cat ios/App/App/App.entitlements
          echo "===== Info.plist NSHealth ====="
          grep -n "NSHealth" ios/App/App/Info.plist || echo "(なし)"
          echo "===== packageClassList ====="
          grep -A12 packageClassList ios/App/App/capacitor.config.json
          APP=$(find build/ios -path "*Products/Applications/*.app" -type d 2>/dev/null | head -1)
          echo "===== signed app: $APP ====="
          if [ -n "$APP" ]; then
            echo "----- 署名済みエンタイトルメント -----"
            codesign -d --entitlements :- "$APP" 2>/dev/null | tr -cd '\11\12\15\40-\176'
            echo ""
            echo "----- healthkit判定 -----"
            (codesign -d --entitlements :- "$APP" 2>/dev/null | tr -cd '\11\12\15\40-\176' | grep -i health) && echo ">>> HEALTHKIT ENTITLEMENT: 有り" || echo ">>> HEALTHKIT ENTITLEMENT: 無し（これが原因）"
          else
            echo "app が見つかりません"
          fi
          echo "===== END VERIFY ====="
          set -e
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ===== React Native版（native/）→ TestFlight =====
  # 手動実行のみ（Start new build でこのworkflowを選択）。
  # 事前準備: Apple Developer portalで Bundle ID com.gotcha.bodylog.rn を登録し、
  # App Store Connectでアプリを作成しておくこと（署名プロファイルは自動生成される）。
  rn-testflight:
    name: BodyLog RN (native/) → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bodylog-asc
    environment:
      xcode: latest
      node: 22
      vars:
        BUNDLE_ID: com.gotcha.bodylog.rn
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gotcha.bodylog.rn
    scripts:
      - name: Install dependencies
        script: |
          cd native
          npm install
      - name: Expo prebuild（iosプロジェクト生成＋pod install）
        script: |
          cd native
          npx expo prebuild --platform ios
      - name: aps-environmentを除去（ローカル通知のみ運用）
        script: |
          # expo-notificationsのpluginがリモートPush用のaps-environmentを自動付与するが、
          # 現状の通知は全てローカル通知でありPush capabilityは不要。
          # 署名プロファイルにPush capabilityが無くてもビルドが通るようentitlementから除去する。
          # （将来リモートPushを使う時は、App IDにPush capabilityを追加してこのステップを削除すること）
          ENT="native/ios/BodyLog/BodyLog.entitlements"
          if [ -f "$ENT" ]; then
            plutil -remove aps-environment "$ENT" 2>/dev/null && echo "aps-environment removed" || echo "aps-environment not present (ok)"
            plutil -p "$ENT"
          fi
      - name: Set build number
        script: |
          cd native/ios
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          # node_modules内のxcodeprojを触らないよう対象を限定（--warn-onlyで非対応プロジェクトはスキップ）
          xcode-project use-profiles --project "native/ios/BodyLog.xcodeproj" --warn-only
          set +e
          xcode-project build-ipa --workspace native/ios/BodyLog.xcworkspace --scheme BodyLog
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "=================== xcodebuild エラー抜粋 ==================="
            LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LOG" ]; then
              grep -nE "(: error:|error generated|❌|fatal error:)" "$LOG" | head -60
              echo "-------------------- ログ末尾200行 --------------------"
              tail -200 "$LOG"
            fi
            echo "============================================================"
          fi
          exit $RC
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
