# BodyLog iOS — Codemagic クラウドビルド設定（Mac不要でTestFlightまで届ける）
# 事前準備（Codemagic側のUIで1回だけ）:
#  1. Teams > Integrations > App Store Connect でAPIキーを登録（名前: bodylog-asc）
#  2. このリポジトリをCodemagicに接続し、このworkflowを実行
workflows:
  ios-testflight:
    name: BodyLog iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # 旧Capacitor版の自動ビルドは停止（2026-08-26）。本命は ios-release（RN版）。
    # 手動でStart new buildすれば今もビルド可能。
    # 注意: integrationsはpublishing(ASC)が参照するため、トリガーを外しても残すこと
    integrations:
      app_store_connect: bodylog-asc
    environment:
      xcode: latest
      node: 22
      vars:
        BUNDLE_ID: com.gotcha.bodylog
        # ウィジェットのビルドスイッチ。Apple Developer portalでApp Group
        # (group.com.gotcha.bodylog) を両Bundle IDに設定済み（2026-08-05完了）
        ENABLE_WIDGET: "true"
      ios_signing:
        # bundle_identifierは拡張（com.gotcha.bodylog.*）のプロファイルにも自動マッチする
        distribution_type: app_store
        bundle_identifier: com.gotcha.bodylog
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Add widget extension target (ENABLE_WIDGET=true のみ)
        script: |
          if [ "$ENABLE_WIDGET" != "true" ]; then
            echo "ENABLE_WIDGET != true → ウィジェットなしでビルド"
            exit 0
          fi
          # 本体アプリのentitlementsにApp Groupを注入（ビルド時のみ・リポジトリは汚さない）
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" ios/App/App/App.entitlements || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string group.com.gotcha.bodylog" ios/App/App/App.entitlements || true
          gem list -i xcodeproj > /dev/null 2>&1 || gem install xcodeproj --no-document
          ruby scripts/add-widget-target.rb
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          xcode-project use-profiles
          set +e
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          RC=$?
          if [ $RC -ne 0 ]; then
            # 失敗時: 生のxcodebuildログからエラー行を抜き出してこのステップのログに直接出す
            echo "=================== xcodebuild エラー抜粋 ==================="
            LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LOG" ]; then
              grep -nE "(: error:|error generated|❌|fatal error:)" "$LOG" | head -60
              echo "-------------------- ログ末尾200行 --------------------"
              tail -200 "$LOG"
            else
              echo "xcodebuildログが見つかりません"
            fi
            echo "============================================================"
          fi
          exit $RC
      - name: Verify entitlements (診断)
        script: |
          set +e
          echo "===== pbxproj CODE_SIGN_ENTITLEMENTS ====="
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj || echo "(なし)"
          echo "===== App.entitlements ====="
          cat ios/App/App/App.entitlements
          echo "===== Info.plist NSHealth ====="
          grep -n "NSHealth" ios/App/App/Info.plist || echo "(なし)"
          echo "===== packageClassList ====="
          grep -A12 packageClassList ios/App/App/capacitor.config.json
          APP=$(find build/ios -path "*Products/Applications/*.app" -type d 2>/dev/null | head -1)
          echo "===== signed app: $APP ====="
          if [ -n "$APP" ]; then
            echo "----- 署名済みエンタイトルメント -----"
            codesign -d --entitlements :- "$APP" 2>/dev/null | tr -cd '\11\12\15\40-\176'
            echo ""
            echo "----- healthkit判定 -----"
            (codesign -d --entitlements :- "$APP" 2>/dev/null | tr -cd '\11\12\15\40-\176' | grep -i health) && echo ">>> HEALTHKIT ENTITLEMENT: 有り" || echo ">>> HEALTHKIT ENTITLEMENT: 無し（これが原因）"
          else
            echo "app が見つかりません"
          fi
          echo "===== END VERIFY ====="
          set -e
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ===== React Native版（native/）→ TestFlight =====
  # 手動実行のみ（Start new build でこのworkflowを選択）。
  # 事前準備: Apple Developer portalで Bundle ID com.gotcha.bodylog.rn を登録し、
  # App Store Connectでアプリを作成しておくこと（署名プロファイルは自動生成される）。
  rn-testflight:
    name: BodyLog RN (native/) → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bodylog-asc
    environment:
      xcode: latest
      node: 22
      # Codemagic UIの環境変数グループ「rc」: EXPO_PUBLIC_RC_IOS_KEY（RevenueCatのApple公開キー）
      # 2026-08-26 ユーザーがグループ作成済み → 有効化
      groups:
        - rc
      vars:
        BUNDLE_ID: com.gotcha.bodylog.rn
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gotcha.bodylog.rn
    scripts:
      - name: Install dependencies
        script: |
          cd native
          npm install
      - name: Expo prebuild（iosプロジェクト生成＋pod install）
        script: |
          cd native
          npx expo prebuild --platform ios
      - name: 未使用のentitlementを除去（署名プロファイルとの不一致を防ぐ）
        script: |
          # prebuildが付与するentitlementのうち、App ID側にcapabilityが無いものは
          # 署名時に「Provisioning profile doesn't include ...」で必ず失敗するため除去する。
          #  ・aps-environment: 通知は全てローカル通知でPush capabilityは不要
          # applesigninは有効化済み（App IDにSign In with Apple capability必須。2026-08-26〜）
          ENT="native/ios/BodyLog/BodyLog.entitlements"
          if [ -f "$ENT" ]; then
            plutil -remove aps-environment "$ENT" 2>/dev/null && echo "aps-environment removed" || echo "aps-environment not present (ok)"
            # Associated Domains（ログインのパスワード自動入力をWebと共有）は、App ID側でcapabilityを有効化し
            # Team IDをAASAに埋めた後に ENABLE_ASSOCIATED_DOMAINS=true で点灯する（docs/LOGIN-AUTOFILL.md）。
            # 未設定のまま宣言だけ残すと自動署名が古いプロファイルを再利用して必ず失敗する（2026-09-02のビルド失敗）。
          # 注意: plutil はキー内のドット（com.apple.…）を階層区切りと誤解釈して静かに失敗する（build_ipa(6)で判明）。
          # ドット入りキーの操作は必ず PlistBuddy（区切りは「:」）を使うこと。
            if [ "$ENABLE_ASSOCIATED_DOMAINS" != "true" ]; then
              /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" "$ENT" 2>/dev/null && echo "associated-domains removed (ENABLE_ASSOCIATED_DOMAINS != true)" || echo "associated-domains not present (ok)"
            fi
            plutil -p "$ENT"
          fi
      - name: Add widget extension target (ENABLE_WIDGET=true のみ)
        script: |
          # ホームウィジェット（B-9）。ENABLE_WIDGET未設定なら何もしない＝従来ビルドと完全に同一。
          # 上の「未使用のentitlementを除去」はaps-environmentしか触らないため、
          # ここで足すApp Groupが消されることはない（除去→追加の順序で安全）。
          if [ "$ENABLE_WIDGET" != "true" ]; then
            echo "ENABLE_WIDGET != true → ウィジェットなしでビルド（従来と同一）"
            exit 0
          fi
          # 本体アプリのentitlementsにApp Groupを注入（ビルド時のみ・リポジトリは汚さない）
          ENT="native/ios/BodyLog/BodyLog.entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" "$ENT" || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string group.com.gotcha.bodylog.rn" "$ENT" || true
          plutil -p "$ENT"
          # 拡張ターゲットをpbxprojへ注入（この後のagvtoolがウィジェットのビルド番号も揃える）
          gem list -i xcodeproj > /dev/null 2>&1 || gem install xcodeproj --no-document
          ruby scripts/add-widget-target-rn.rb
      - name: Live Activity（ダイナミックアイランド）の下ごしらえを確認 (DISABLE_LIVE_ACTIVITY=true で停止)
        script: |
          # ダイナミックアイランドのレスト残り時間（docs/LIVE-ACTIVITY.md）。**2026-09-25 から既定で入る。**
          # 拡張ターゲット（ExpoWidgetsTarget・Bundle ID …rn.liveactivity）・本体の App Group entitlement・
          # NSSupportsLiveActivities・Podfile の拡張 target は、native/app.config.js の expo-widgets plugin が
          # prebuild で入れる。ここがやるのは「本当に入ったか」の確認と、App Group の正規化（1件に揃える）だけ。
          #
          # 退避: 環境変数 DISABLE_LIVE_ACTIVITY=true → app.config.js が app.json をそのまま返し、ここも何もしない
          #       ＝Live Activity 導入前のビルドと完全に同一（yaml の vars には書かない。UI から都度指定する）。
          if [ "$DISABLE_LIVE_ACTIVITY" = "true" ]; then
            echo "DISABLE_LIVE_ACTIVITY=true → Live Activity なしでビルド（導入前と同一）"
            exit 0
          fi
          set -e
          ENT="native/ios/BodyLog/BodyLog.entitlements"
          GROUP="group.com.gotcha.bodylog.rn"
          # App Group を「ちょうど1件」に正規化する。plugin（prebuild）と ENABLE_WIDGET のステップの両方が
          # 同じ group を Add しうるので、重複していても欠けていてもここで1件に揃える（同じ値なので安全）
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.application-groups" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string $GROUP" "$ENT"
          plutil -p "$ENT"
          # 入っているはずのものを確認。欠けていたら「島が出ないビルド」を静かに出荷しないよう、ここで止める
          FAIL=0
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" native/ios/BodyLog/Info.plist >/dev/null 2>&1 && echo "✅ NSSupportsLiveActivities" || { echo "❌ NSSupportsLiveActivities が Info.plist に無い"; FAIL=1; }
          grep -q 'ExpoWidgetsTarget' native/ios/BodyLog.xcodeproj/project.pbxproj && echo "✅ 拡張ターゲット ExpoWidgetsTarget" || { echo "❌ ExpoWidgetsTarget が pbxproj に無い"; FAIL=1; }
          grep -q 'com.gotcha.bodylog.rn.liveactivity' native/ios/BodyLog.xcodeproj/project.pbxproj && echo "✅ 拡張の Bundle ID (…rn.liveactivity)" || { echo "❌ 拡張の Bundle ID (…rn.liveactivity) が pbxproj に無い"; FAIL=1; }
          grep -q 'target "ExpoWidgetsTarget"' native/ios/Podfile && echo "✅ Podfile の拡張 target" || { echo "❌ Podfile に拡張 target が無い"; FAIL=1; }
          [ -f native/ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements ] && echo "✅ 拡張の entitlements" || { echo "❌ 拡張の entitlements が無い"; FAIL=1; }
          if [ "$FAIL" = "1" ]; then
            echo "❌ app.config.js の expo-widgets plugin が prebuild で効いていません。" >&2
            echo "   まず戻すなら環境変数 DISABLE_LIVE_ACTIVITY=true で再ビルド。原因は docs/LIVE-ACTIVITY.md「失敗したときの読み方」。" >&2
            exit 1
          fi
      - name: 署名プロファイルの整合（entitlementに合わないプロファイルを捨てて作り直す）
        script: |
          # Codemagicの自動署名は既存プロファイルを再利用するため、App IDにcapabilityを足しても
          # 古いプロファイル（Associated Domains無し／App Groups無し）で署名が失敗し続ける（2026-09-03 build_ipa(5)）。
          # ここで「ビルドに必要なentitlement」と「取得済みプロファイルのentitlement」を比較し、
          # 足りなければ該当プロファイルをポータルから削除→作り直し→再適用する。手作業の削除を不要にする。
          #
          # 見る対象（bundle id ／ 要る entitlement）— 2026-09-25 に Live Activity（既定ON）ぶんを足した:
          #   ・本体 $BUNDLE_ID ………………… associated-domains（ENABLE_ASSOCIATED_DOMAINS=true のとき）
          #                                    application-groups（Live Activity 既定ON／ENABLE_WIDGET=true。entitlements に入っていれば）
          #   ・拡張 $BUNDLE_ID.liveactivity … application-groups（DISABLE_LIVE_ACTIVITY=true 以外）
          # 拡張の App ID がポータルに無い（＝プロファイルが1本も無い）のは「古い」ではなく「未作成」。
          # 削除しても直らないので、ここで止めて docs/LIVE-ACTIVITY.md 手順1 へ案内する。
          set -e   # 途中の失敗を握りつぶさない（2026-09-04 に握りつぶしで Build ipa が空振りした）
          ENT="native/ios/BodyLog/BodyLog.entitlements"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          AD_KEY="com.apple.developer.associated-domains"
          AG_KEY="com.apple.security.application-groups"
          LA_BUNDLE_ID="$BUNDLE_ID.liveactivity"

          NEED_AD=0; /usr/libexec/PlistBuddy -c "Print :$AD_KEY" "$ENT" >/dev/null 2>&1 && NEED_AD=1
          NEED_AG=0; /usr/libexec/PlistBuddy -c "Print :$AG_KEY" "$ENT" >/dev/null 2>&1 && NEED_AG=1
          NEED_LA=0; [ "$DISABLE_LIVE_ACTIVITY" != "true" ] && NEED_LA=1
          echo "必要: associated-domains=$NEED_AD app-groups(本体)=$NEED_AG live-activity拡張=$NEED_LA (ENABLE_ASSOCIATED_DOMAINS=${ENABLE_ASSOCIATED_DOMAINS:-unset} DISABLE_LIVE_ACTIVITY=${DISABLE_LIVE_ACTIVITY:-unset})"

          # 要件の一覧: 「bundle id|entitlement キー」を1行ずつ
          REQS=""
          [ "$NEED_AD" = "1" ] && REQS="$REQS$BUNDLE_ID|$AD_KEY"$'\n'
          [ "$NEED_AG" = "1" ] && REQS="$REQS$BUNDLE_ID|$AG_KEY"$'\n'
          [ "$NEED_LA" = "1" ] && REQS="$REQS$LA_BUNDLE_ID|$AG_KEY"$'\n'
          if [ -z "$REQS" ]; then echo "capability 付きの entitlement は無い＝整合の確認は不要"; exit 0; fi

          # 手元のプロファイルを見て、bundle id ごとに「有無」と「entitlement を含むか」を判定する。
          # 戻り値 0:満たす 1:あるが古い 2:プロファイルが1本も無い
          # パスに空白（"Provisioning Profiles"）があるため必ずクォートする。
          # 2026-09-04: 未クォートで glob が2語に割れて1件もマッチせず、「要件を満たしている」と
          # 誤判定して古いプロファイルのまま Build ipa に進み、Associated Domains で失敗した
          check() {
            local found=0 ok=0 f bid
            for f in "$PROFILES/"*.mobileprovision; do
              [ -f "$f" ] || continue
              security cms -D -i "$f" > /tmp/prof.plist 2>/dev/null || continue
              bid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/prof.plist 2>/dev/null)
              [ "${bid#*.}" = "$1" ] || continue    # "TEAMID.bundle.id" → bundle.id を厳密一致（前方一致だと本体と拡張を取り違える）
              found=1
              if /usr/libexec/PlistBuddy -c "Print :Entitlements:$2" /tmp/prof.plist >/dev/null 2>&1; then ok=1; else
                echo "  古いプロファイル: $(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/prof.plist 2>/dev/null) ($(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/prof.plist 2>/dev/null)) — $2 無し"
              fi
            done
            [ "$ok" = "1" ] && return 0
            [ "$found" = "1" ] && return 1
            return 2
          }
          STALE=""; MISSING=""
          while IFS='|' read -r bid key; do
            [ -n "$bid" ] || continue
            set +e; check "$bid" "$key"; rc=$?; set -e
            case $rc in
              0) echo "✅ $bid: $key を含むプロファイルあり";;
              1) echo "⚠️ $bid: プロファイルはあるが $key が無い（古い）"; STALE="$STALE $bid";;
              *) echo "❌ $bid: プロファイルが1本も無い（App ID 未作成の可能性）"; MISSING="$MISSING $bid";;
            esac
          done <<< "$REQS"

          if [ -n "$MISSING" ]; then
            echo "❌ 次の Bundle ID のプロファイルが取得できていません:$MISSING" >&2
            echo "   Apple Developer → Identifiers に App ID があるか確認してください（docs/LIVE-ACTIVITY.md 手順1）:" >&2
            echo "   https://developer.apple.com/account/resources/identifiers/list" >&2
            echo "   拡張（$LA_BUNDLE_ID）は App Groups capability に group.com.gotcha.bodylog.rn を紐付けること。" >&2
            echo "   いったん戻すなら環境変数 DISABLE_LIVE_ACTIVITY=true で再ビルド（Live Activity 導入前と同一のビルド）。" >&2
            exit 1
          fi
          if [ -z "$STALE" ]; then echo "取得済みプロファイルは要件を満たしています"; exit 0; fi

          DELETE_FAILED=0
          # 古い bundle id の App Store 用プロファイルを全て削除（CIが自動生成する使い捨てなので安全）→作り直し。
          # 一覧が空（APIキーの権限で読めない・build(9)で実際にそうだった）なら削除もできないので、手動削除の案内へ
          for bid in $(echo "$STALE" | tr ' ' '\n' | sort -u); do
            IDS=$(app-store-connect profiles list --bundle-id-identifier "$bid" --profile-type IOS_APP_STORE --json 2>/dev/null | jq -r ".[].id" 2>/dev/null)
            if [ -z "$IDS" ]; then echo "⚠️ API から $bid のプロファイル一覧が取れません（権限不足の可能性）。ポータルで手動削除が必要です"; DELETE_FAILED=1; fi
            for id in $IDS; do
              # 削除の失敗を握りつぶさない: APIキーの権限（Developer 役割）では削除できないことがあり、
              # 2026-09-04 (7)(8) はこれが毎回失敗→手元だけ消える→ゼロで Build ipa が落ちるループだった
              if app-store-connect profiles delete "$id"; then echo "deleted profile $id ($bid)"; else echo "⚠️ profile $id の削除に失敗（APIキーの権限不足の可能性）"; DELETE_FAILED=1; fi
            done
          done
          rm -f "$PROFILES/"*.mobileprovision
          # 作り直しを試す（$BUNDLE_ID の前方一致＝拡張 …rn.liveactivity / …rn.widget もまとめて取り直す）。
          # ユーザースクリプトの文脈では証明書の秘密鍵が渡らず失敗することがある
          # （2026-09-04 build_ipa(7): 失敗が echo で握りつぶされ Build ipa が空のプロファイルで落ちた）。
          # 失敗しても止めず、下の「実際に出来たか」の検証で判定する
          app-store-connect fetch-signing-files "$BUNDLE_ID" --platform IOS --type IOS_APP_STORE --create || echo "fetch-signing-files --create は失敗（下で判定）"
          ALL_OK=1
          while IFS='|' read -r bid key; do
            [ -n "$bid" ] || continue
            set +e; check "$bid" "$key"; rc=$?; set -e
            [ "$rc" = "0" ] || ALL_OK=0
          done <<< "$REQS"
          if [ "$ALL_OK" = "1" ]; then
            # 新しいプロファイルを Xcode プロジェクトに掛け直す（Build ipa 側の use-profiles だけに任せない）
            xcode-project use-profiles --project "native/ios/BodyLog.xcodeproj" --warn-only
            echo "✅ プロファイルを作り直しました（要件の entitlement 込み）"
          else
            echo "❌ 要件を満たすプロファイルを手元に作れませんでした。" >&2
            echo "   ポータルの古いプロファイルは削除済みなので、**このワークフローをもう一度実行**すると" >&2
            echo "   Codemagic の自動署名（ビルド前）が現在の capability で新しいプロファイルを作ります。" >&2
            if [ "${DELETE_FAILED:-0}" = "1" ]; then
              echo "   ⚠️ ポータルのプロファイル削除が失敗しています。手動で削除してください:" >&2
              echo "      https://developer.apple.com/account/resources/profiles/list → 該当 Bundle ID の App Store 用を Delete" >&2
            fi
            echo "   それでも同じなら Apple Developer → Identifiers で capability（Associated Domains ／ App Groups と group の紐付け）が ON か確認。" >&2
            echo "   Live Activity だけ切って先に出すなら環境変数 DISABLE_LIVE_ACTIVITY=true。" >&2
            exit 1
          fi
      - name: Set build number
        script: |
          cd native/ios
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          # node_modules内のxcodeprojを触らないよう対象を限定（--warn-onlyで非対応プロジェクトはスキップ）
          xcode-project use-profiles --project "native/ios/BodyLog.xcodeproj" --warn-only
          set +e
          xcode-project build-ipa --workspace native/ios/BodyLog.xcworkspace --scheme BodyLog
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "=================== xcodebuild エラー抜粋 ==================="
            LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LOG" ]; then
              grep -nE "(: error:|error generated|❌|fatal error:)" "$LOG" | head -60
              echo "-------------------- ログ末尾200行 --------------------"
              tail -200 "$LOG"
            fi
            echo "============================================================"
          fi
          exit $RC
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ===== React Native版（native/）→ Google Play（.aab） =====
  # 手動実行のみ（Start new build でこのworkflowを選択）。
  # 事前準備（Codemagic側のUIで1回だけ）:
  #  1. Teams > Code signing identities > Android keystores にキーストアをアップロードし、
  #     Reference name を「bodylog_keystore」にする（下のandroid_signingが参照する）。
  #     キーストアが無ければ手元で生成する（docs/ANDROID.md にkeytoolコマンド例あり）。
  #  2. キーストア未アップロードの間は下の android_signing の2行をコメントアウトすれば
  #     無署名でもビルド自体は通る（Playへは提出できないが動作確認用にはなる）。
  # 公開: ビルド成功で **内部テストトラックに自動アップロード**される（下の publishing）。
  #  3. Codemagic UI の環境変数グループ「google_play」に、Google Cloud で作った
  #     サービスアカウントJSONの**中身をそのまま** GCLOUD_SERVICE_ACCOUNT_CREDENTIALS として
  #     登録し、Secure（暗号化）にする。手順は docs/ANDROID.md「Playへの自動アップロード」。
  rn-android:
    name: BodyLog RN (native/) → Google Play (aab)
    # linux_x2は無料の個人プランでは使えない（"instance type is not available with the
    # current billing plan"で失敗・2026-09-01実測）。iOS側と同じmacマシンならAndroidも
    # ビルドできるため揃える。有料チーム化したらlinux_x2に戻すとコスト減
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # iOS側（rn-testflight）とNodeメジャーを揃える。JavaはAGP要件の17
      node: 22
      java: 17
      # Codemagic UIの環境変数グループ「rc」（iOS側と共用）。
      # RevenueCatのGoogle Play公開キーを発行したら EXPO_PUBLIC_RC_ANDROID_KEY をこのグループに
      # 追加する。未設定の間はアプリ側が安全に「未課金」扱いになる（課金UIが出ないだけ）
      groups:
        - rc
        # サービスアカウントJSON（GCLOUD_SERVICE_ACCOUNT_CREDENTIALS）。
        # 下の publishing > google_play が参照する。Secure で登録すること
        - google_play
      android_signing:
        - bodylog_keystore
    scripts:
      - name: Install dependencies
        script: |
          cd native
          npm ci
      - name: Set versionCode（iOSのagvtoolに相当）
        script: |
          # Google Playは同じversionCodeを二度受け付けないため、ビルドごとに必ず増える
          # Codemagicの $PROJECT_BUILD_NUMBER を app.json の android.versionCode に注入する。
          # version文字列（マーケティングバージョン）はリポジトリの値のまま＝docs/RELEASE.mdの運用
          cd native
          node -e "
            const fs = require('fs');
            const p = './app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.android.versionCode = Number(process.env.PROJECT_BUILD_NUMBER);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('android.versionCode =', j.expo.android.versionCode);
          "
      - name: Expo prebuild（androidプロジェクト生成）
        script: |
          cd native
          npx expo prebuild --platform android
      - name: リリース署名を注入（prebuildのbuild.gradleはreleaseもデバッグ鍵で署名するため）
        script: |
          # 2026-09-03: この注入が無いまま作った .aab は Play で
          # 「デバッグモードで署名されています」と拒否された。詳細は scripts/inject-android-signing.js
          node scripts/inject-android-signing.js native/android/app/build.gradle
      - name: Build aab
        script: |
          # 注意: android_signing はキーストアを**用意するだけ**で、gradle には自動注入されない。
          # 実際の署名設定は直前の「リリース署名を注入」ステップが build.gradle へ書き込む
          # （2026-09-03: この誤解でデバッグ署名の .aab を作り Play に拒否された）。
          cd native/android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: 署名の検証（デバッグ署名の.aabを世に出さない最後の砦）
        script: |
          set -e
          AAB=$(ls -t native/android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "検証対象: $AAB"
          # apksigner が入っていない環境でも動くよう、まず keytool でメタ情報を見る
          unzip -p "$AAB" META-INF/*.RSA > /tmp/sig.rsa 2>/dev/null || unzip -p "$AAB" META-INF/*.EC > /tmp/sig.rsa
          SUBJ=$(keytool -printcert -file /tmp/sig.rsa | grep -m1 "所有者\|Owner")
          echo "署名者: $SUBJ"
          if echo "$SUBJ" | grep -qi "Android Debug"; then
            echo "❌ デバッグ鍵で署名されています。Play にアップロードできません" >&2
            exit 1
          fi
          echo "✅ リリース鍵で署名されています"
    artifacts:
      - native/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # 内部テストにだけ入れる。製品版への昇格は必ず人間が Play Console で行う
        # （審査に出る経路を自動化しない）
        track: internal
        # changes_not_sent_for_review は**付けない**（既定のまま）。
        # 2026-09-04 に true を入れたら、bundle のアップロードは通ったのに
        # トラック割り当てで Google に拒否された:
        #   "Changes are sent for review automatically.
        #    The query parameter changesNotSentForReview must not be set."
        # このアプリは変更が自動でレビューに送られる状態なので、渡すこと自体が誤り。
